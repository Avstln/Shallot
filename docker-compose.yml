volumes:
  certs:
  pcap:
  esdata:
  kbdata:
  outputLogs:
  splunkingest:
  splunkdata:
  splunketc:

networks:
  default:
    name: elastic
    external: false

services:
  setup:
    image: elasticsearch:${STACK_VERSION}
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: kb01\n"\
          "    dns:\n"\
          "      - kb01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R root:root config/certs;
        find config/certs -type d -exec chmod 750 \{\} \;;
        find config/certs -type f -exec chmod 640 \{\} \;;
        echo "Waiting for Elasticsearch availability";
        until curl -s --cacert config/certs/ca/ca.crt https://es01:9200 | grep -q "missing authentication credentials"; do sleep 30; done;
        echo "Setting kibana_system password";
        until curl -s -X POST --cacert config/certs/ca/ca.crt -u "elastic:${ELASTIC_PASSWORD}" -H "Content-Type: application/json" https://es01:9200/_security/user/kibana_system/_password -d "{\"password\":\"${KIBANA_PASSWORD}\"}" | grep -q "^{}"; do sleep 10; done;
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120
  webserver:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY ./app.py .
        RUN mkdir templates
        COPY ./upload.html templates/.
        COPY ./logo.jpg templates/.
        RUN pip install Flask docker
        RUN chmod +x ./app.py
    command: bash -c 'python app.py'
    volumes:
      - pcap:/app/uploads
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - ${WEB_SERVER}:5000

  es01:
    depends_on:
      setup:
        condition: service_healthy
    image: elasticsearch:${STACK_VERSION}
    labels:
      co.elastic.logs/module: elasticsearch
    volumes:
      - certs:/usr/share/elasticsearch/config/certs
      - esdata:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
    mem_limit: ${ES_MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt -o /dev/null -w \"%{http_code}\" https://localhost:9200 | grep -q 401",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
  kb01:
    depends_on:
      es01:
        condition: service_healthy
    image: kibana:${STACK_VERSION}
    labels:
      co.elastic.logs/module: kibana
    volumes:
      - certs:/usr/share/kibana/config/certs
      - kbdata:/usr/share/kibana/data
    ports:
      - ${KIBANA_PORT}:5601
    environment:
      - SERVERNAME=kb01
      - ELASTICSEARCH_HOSTS=https://es01:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD}
      - ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES=config/certs/ca/ca.crt
      - XPACK_SECURITY_ENCRYPTIONKEY=${ENCRYPTION_KEY}
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${ENCRYPTION_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${ENCRYPTION_KEY}
    mem_limit: ${KB_MEM_LIMIT}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120
  fb01:
    depends_on:
      es01:
        condition: service_healthy
      kb01:
        condition: service_healthy
    mem_limit: 512m
    build:
      context: .
      dockerfile_inline: |
        FROM docker.elastic.co/beats/filebeat:${STACK_VERSION}
        USER root
        WORKDIR /usr/share/filebeat
        ENV ELASTIC_USER=elastic
        ENV ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
        ENV ELASTIC_HOSTS=https://es01:9200
        ENV KIBANA_HOSTS=http://kb01:5601
        COPY filebeat.yml .
        RUN chmod go-w /usr/share/filebeat/filebeat.yml
        RUN ./filebeat modules enable zeek suricata
        RUN sed -i 's/false/true\n    var.paths: \["\/usr\/share\/filebeat\/ingest_data\/eve.json"\]/' /usr/share/filebeat/modules.d/suricata.yml
        COPY zeek.yml /usr/share/filebeat/modules.d/zeek.yml
        RUN chmod go-w /usr/share/filebeat/modules.d/zeek.yml
    volumes:
      - certs:/usr/share/filebeat/certs
      - outputLogs:/usr/share/filebeat/ingest_data/
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    command: bash -c 'filebeat setup || true; exec filebeat -e'
      
  zk01:
    depends_on:
      es01:
        condition: service_healthy
    image: zeek/zeek:${ZEEK_VERSION}
    mem_limit: 1g
    command: tail -F anything
    volumes:
      - outputLogs:/zeekLogs
      - splunkingest:/splunkIngest
      - pcap:/pcap
    environment:
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - ELASTIC_HOSTS=https://es01:9200
      - KIBANA_HOSTS=http://kb01:5601

  sur01:
    image: jasonish/suricata:${SURICATA_VERSION}
    mem_limit: 1g
    volumes:
      - "./suricata.yaml:/etc/suricata/suricata.yaml"
      - "./local.rules:/home/suricata/local.rules"
      - outputLogs:/var/log/suricata
      - pcap:/pcap
    environment:
      - ELASTIC_HOSTS=https://es01:9200
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    command: >
      suricata
        -c /etc/suricata/suricata.yaml
        --pcap-file-continuous
        --pcap-file-delete
        -r /pcap 
        -k none
        -S /home/suricata/local.rules
        -l /var/log/suricata/
        -vv
    
  splunk01:
    depends_on:
      es01:
        condition: service_healthy
    image: splunk/splunk:${SPLUNK_VERSION}
    mem_limit: 2g
    ports:
      - ${SPLUNK_PORT}:8000
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD}
    volumes:
      - splunkingest:/opt/splunk/var/spool/splunk/
      - splunkdata:/opt/splunk/var
      - splunketc:/opt/splunk/etc

